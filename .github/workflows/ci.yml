name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint (ESLint + design-token guard)
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Build static export
        run: npm run build

      - name: UI audit on the built site
        run: |
          mkdir -p _site && cp -r out _site/ritmologia-landing
          python3 -m http.server 8080 --directory _site >/dev/null 2>&1 &
          sleep 2
          URL=http://localhost:8080/ritmologia-landing/ \
            CHROME="$(command -v google-chrome)" npm run audit:ui
